name: Gridfire Test

# gridfire_template_version: stage3-py-django-api/v1

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to test
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saleor
          POSTGRES_PASSWORD: saleor
          POSTGRES_DB: saleor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saleor -d saleor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://saleor:saleor@localhost:5432/saleor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1 libpq-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run scoped Django API tests
        run: uv run pytest saleor/graphql/account/tests -n0
